name: CI
# Pipeline map, gates and timings: docs/ci-cd.md.
#   pull_request            API + API image + iOS unit + UI smoke (≈10 min)
#   push to main            API + API image + E2E → Deploy API; iOS unit; UI build once → full UI suite (5 shards) + E2E
#   nightly, manual run     everything, same as a push to main (manual run on main also re-tries the deploy)
# Path filters (job "changes", ci/changes.sh): PRs and pushes run only what their changes need. docs-only: nothing;
# api-only: API jobs (+ on main: UI build, E2E, deploy), no iOS unit or UI shards. A push compares with the last green
# run of main, so commits whose runs were cancelled are still covered.

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *"  # nightly full UI suite, on main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Nightly runs get their own group, so they never replace a pending push run (and its deploy).
  group: ci-${{ github.event_name == 'schedule' && 'nightly' || github.ref }}
  # PRs: a new push cancels the old run. main: a running run is never cut off (nor its deploy); GitHub keeps one
  # pending run per group, so a newer push replaces the waiting one. The waiting run is always the newest commit,
  # and ci/changes.sh diffs it against the last green run, so it tests every skipped commit's changes too.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  SIMULATOR: ${{ vars.CI_SIMULATOR || 'iPhone 17' }}
  OS: ${{ vars.CI_IOS_VERSION || 'latest' }}
  # One build at a time per runner, so xcodebuild gets -jobs <all CPUs> (scripts/_ios-env.sh; the default 2 slots
  # left the 3-CPU runner at -jobs 1).
  BUILD_SLOTS: 1

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read  # ci/changes.sh: the last green run of main
    outputs:
      api: ${{ steps.diff.outputs.api }}
      app: ${{ steps.diff.outputs.app }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
        with:
          fetch-depth: 0  # diff against an older commit
      - id: diff
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
        run: ci/changes.sh >> "$GITHUB_OUTPUT"

  api:
    name: API (ruff + pytest)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - run: scripts/api-test.sh

  api-image:
    name: API (docker build)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - name: Build the production image (same as Dokploy)
        run: docker build -t la-carte-api:ci api/
      - name: Starts and answers /health
        run: |
          # spec 030a: a token without an owner email refuses to start; /health stays public (no bearer)
          # spec 032a: production needs LA_CARTE_DB_KEY (a throwaway one here), the file is SQLCipher
          docker run -d --name api -p 8000:8000 -e LA_CARTE_API_TOKEN=ci-token \
            -e LA_CARTE_OWNER_EMAIL=ci@example.com -e LA_CARTE_PUBLIC_URL=https://ci.example.com \
            -e LA_CARTE_DB_KEY="$(openssl rand -hex 32)" la-carte-api:ci
          for _ in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/health && exit 0; sleep 1; done
          docker logs api; exit 1

  deploy-api:
    name: Deploy API (Dokploy)
    # E2E runs the app against this commit's API: an API change deploys only once it passes too.
    needs: [api, api-image, ios-e2e]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: api-prod  # holds the Dokploy key + live URL secrets; deployment branches: main only
    concurrency:
      group: deploy-api
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - name: Deploy and verify /health
        env:
          DOKPLOY_URL: ${{ vars.DOKPLOY_URL }}
          DOKPLOY_COMPOSE_ID: ${{ vars.DOKPLOY_COMPOSE_ID }}
          DOKPLOY_API_KEY: ${{ secrets.DOKPLOY_API_KEY }}
          LA_CARTE_LIVE_URL: ${{ secrets.LA_CARTE_LIVE_URL }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          if [[ -z "$DOKPLOY_API_KEY" || -z "$DOKPLOY_URL" || -z "$DOKPLOY_COMPOSE_ID" || -z "$LA_CARTE_LIVE_URL" ]]; then
            echo "::notice::Deploy not configured (environment api-prod): skipping. See docs/ci-cd.md."
            exit 0
          fi
          ci/deploy-api.sh

  ios-unit:
    name: iOS unit tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: macos-26
    timeout-minutes: 40  # ScreenColorTests ≈14 min of a ≈22 min job; a slow runner overran 30 in 45865720258
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: latest-stable  # deployment target is iOS 26; newest non-beta Xcode on the image
      - run: scripts/ios-test.sh

  ios-ui-smoke:
    name: iOS UI smoke (light)
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.app == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Boot simulator (background, during the build)
        run: ci/boot-simulator.sh --start
      - name: Build app + UI tests
        run: ci/build-ui-tests.sh "$RUNNER_TEMP/LaCarte.xctestproducts"
      - name: Wait for the simulator
        run: ci/boot-simulator.sh --wait
      # The smoke set: core flows, light only. Owner of the list: qa-validator (docs/ci-cd.md).
      - name: UI smoke tests (mock deck)
        timeout-minutes: 20  # a hung test must not hold the runner (and main's queue) for 6 h
        env:
          UI_TEST_PRODUCTS: ${{ runner.temp }}/LaCarte.xctestproducts
        run: |
          ci/ui-test.sh scripts/ios-ui-test.sh ci-smoke \
            -only-testing:LaCarteUITests/StudyUITests/testStudy_frontRevealRateNext \
            -only-testing:LaCarteUITests/StudyUITests/testStudy_rateAllToCaughtUp \
            -only-testing:LaCarteUITests/StudyUITests/testStudy_offlineThenRetry \
            -only-testing:LaCarteUITests/DeckUITests/testDeck_rowsFromAPI \
            -only-testing:LaCarteUITests/DeckUITests/testDeck_addFromDeck \
            -only-testing:LaCarteUITests/DeckUITests/testDeck_swipeToDelete \
            -only-testing:LaCarteUITests/SettingsUITests/testSettings_testConnectionMock \
            -only-testing:LaCarteUITests/SetupUITests/testSetup_connectFromStudy \
            -only-testing:LaCarteUITests/RefreshUITests/testStudy_foregroundReload
      - name: Make file names uploadable (an attachment named with " fails the whole upload)
        if: always()
        run: ci/artifact-safe-names.sh qa/screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: screenshots-smoke
          path: qa/screenshots/
          if-no-files-found: ignore

  ios-ui-build:
    name: iOS UI build (once, for all UI jobs)
    needs: changes
    if: github.event_name != 'pull_request' && (needs.changes.outputs.app == 'true' || needs.changes.outputs.api == 'true')
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Build app + UI tests (build-for-testing)
        run: ci/build-ui-tests.sh "$RUNNER_TEMP/LaCarte.xctestproducts"
      - name: Pack (tar keeps the executable bits an artifact zip drops)
        run: tar -cf "$RUNNER_TEMP/ui-products.tar" -C "$RUNNER_TEMP" LaCarte.xctestproducts
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: ui-products
          path: ${{ runner.temp }}/ui-products.tar
          retention-days: 1
          compression-level: 1

  ios-ui:
    name: iOS UI (${{ matrix.shard.name }})
    needs: [changes, ios-ui-build]
    if: needs.changes.outputs.app == 'true'  # api-only changes: E2E only
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        # Balanced on measured CI class durations (runs 45721818305, 45811826958; docs/ci-cd.md → Shards): ≈ 19–26 min
        # of tests each, step timeout 40. The last shard runs every class the others don't name (-skip-testing), so a
        # new UI test class always runs somewhere: move it to a named shard when `rest` nears 30 min.
        # MarketingUITests is not a test suite (demo frames, owner: marketing) and never runs on CI.
        # Quarantined tests (owner, fix: docs/ci-cd.md → Quarantine) are -skip-testing'd in their shard.
        shard:
          - name: deck-settings-study
            tests: >-
              -only-testing:LaCarteUITests/DeckUITests
              -only-testing:LaCarteUITests/SettingsUITests
              -only-testing:LaCarteUITests/StudyUITests
              -only-testing:LaCarteUITests/LaCarteUITests
              -only-testing:LaCarteUITests/RefreshUITests
              -only-testing:LaCarteUITests/LaunchUITests
          - name: setup-widget
            tests: >-
              -only-testing:LaCarteUITests/SetupUITests
              -only-testing:LaCarteUITests/WidgetUITests
              -only-testing:LaCarteUITests/StudyLengthsUITests
          - name: theme-ratings-report
            tests: >-
              -only-testing:LaCarteUITests/ThemeUITests
              -only-testing:LaCarteUITests/RatingsUITests
              -only-testing:LaCarteUITests/ReportUITests
          - name: notes-logo-milestones
            tests: >-
              -only-testing:LaCarteUITests/NotesUITests
              -only-testing:LaCarteUITests/LogoUITests
              -only-testing:LaCarteUITests/StudyMilestonesUITests
              -skip-testing:LaCarteUITests/LogoUITests/testStudy_launchShowsFirstCardNoLogo
          - name: rest
            tests: >-
              -only-testing:LaCarteUITests
              -skip-testing:LaCarteUITests/DeckUITests
              -skip-testing:LaCarteUITests/SettingsUITests
              -skip-testing:LaCarteUITests/StudyUITests
              -skip-testing:LaCarteUITests/LaCarteUITests
              -skip-testing:LaCarteUITests/RefreshUITests
              -skip-testing:LaCarteUITests/LaunchUITests
              -skip-testing:LaCarteUITests/SetupUITests
              -skip-testing:LaCarteUITests/WidgetUITests
              -skip-testing:LaCarteUITests/StudyLengthsUITests
              -skip-testing:LaCarteUITests/ThemeUITests
              -skip-testing:LaCarteUITests/RatingsUITests
              -skip-testing:LaCarteUITests/ReportUITests
              -skip-testing:LaCarteUITests/NotesUITests
              -skip-testing:LaCarteUITests/LogoUITests
              -skip-testing:LaCarteUITests/StudyMilestonesUITests
              -skip-testing:LaCarteUITests/MarketingUITests
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: latest-stable
      - name: Boot simulator (background; appearance switching for dark UI tests)
        run: ci/boot-simulator.sh --start
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: ui-products
          path: ${{ runner.temp }}
      - name: Unpack the UI build
        run: tar -xf "$RUNNER_TEMP/ui-products.tar" -C "$RUNNER_TEMP"
      - name: Wait for the simulator
        run: ci/boot-simulator.sh --wait
      - name: UI tests (mock deck, light + dark)
        timeout-minutes: 40  # ≈ 2× a shard; a hung test held run 45037833157 for > 50 min
        env:
          UI_TEST_PRODUCTS: ${{ runner.temp }}/LaCarte.xctestproducts
        # A failed test is retried once (full suite only, not smoke or E2E): each full run had 1–2 different CI-load
        # flakes in ≈ 120 tests (docs/ci-cd.md → Flaky tests). ci/ui-test.sh flags every test that needed the retry.
        run: >-
          ci/ui-test.sh scripts/ios-ui-test.sh ci-${{ matrix.shard.name }}
          -retry-tests-on-failure -test-iterations 2 ${{ matrix.shard.tests }}
      - name: Make file names uploadable (an attachment named with " fails the whole upload)
        if: always()
        run: ci/artifact-safe-names.sh qa/screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: screenshots-${{ matrix.shard.name }}
          path: qa/screenshots/
          if-no-files-found: ignore

  ios-e2e:
    name: iOS E2E (live API)
    needs: ios-ui-build  # free plan: 5 macOS jobs at once; the last 2 shards start when unit tests and E2E end
    runs-on: macos-26
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5.1.0
      - uses: maxim-lobanov/setup-xcode@ed7a3b1fda3918c0306d1b724322adc0b8cc0a90  # v1.7.0
        with:
          xcode-version: latest-stable
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78  # v7.6.0
      - name: Boot simulator (background)
        run: ci/boot-simulator.sh --start
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131  # v7.0.0
        with:
          name: ui-products
          path: ${{ runner.temp }}
      - name: Unpack the UI build
        run: tar -xf "$RUNNER_TEMP/ui-products.tar" -C "$RUNNER_TEMP"
      - name: Wait for the simulator
        run: ci/boot-simulator.sh --wait
      - name: E2E (fresh API + seeded deck)
        timeout-minutes: 30
        env:
          UI_TEST_PRODUCTS: ${{ runner.temp }}/LaCarte.xctestproducts
        run: ci/ui-test.sh scripts/e2e.sh ci-e2e
      - name: Make file names uploadable (an attachment named with " fails the whole upload)
        if: always()
        run: ci/artifact-safe-names.sh qa/screenshots
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f  # v6.0.0
        with:
          name: screenshots-e2e
          path: qa/screenshots/
          if-no-files-found: ignore
