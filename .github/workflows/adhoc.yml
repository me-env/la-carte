name: iOS Ad Hoc

# Builds a signed Ad Hoc .ipa for the devices registered on team 5X9ZWT7KT3.
# Install it with: scripts/ios-install-device.sh
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write  # create the GitHub Release

jobs:
  ipa:
    runs-on: macos-26
    environment: prod
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '27'  # iOS 27 deployment target needs the Xcode 27 SDK
      - name: Version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF#refs/tags/v}"; else V="0.0.${{ github.run_number }}"; fi
          echo "VERSION=$V" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: Archive
        env:
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
        run: ci/archive.sh
      - name: Export .ipa
        env:
          AC_API_KEY_BASE64: ${{ secrets.AC_API_KEY_BASE64 }}
        run: ci/export-ipa.sh
      - name: Verify
        run: ci/verify-ipa.sh
      - uses: actions/upload-artifact@v4
        with:
          name: la-carte-ipa
          path: build/export/LaCarte.ipa
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 \
            && gh release upload "$GITHUB_REF_NAME" build/export/LaCarte.ipa --clobber \
            || gh release create "$GITHUB_REF_NAME" build/export/LaCarte.ipa --title "$GITHUB_REF_NAME" --generate-notes
      - name: Remove API key
        if: always()
        run: rm -f build/asc-key.p8
