# Production deployment of the la-carte API (Dokploy "Docker Compose" service). See docs/deploy.md.
# Dokploy writes the env vars set in its UI to a .env file next to this file; they reach the
# container only through the ${...} references below. The domain + HTTPS (Traefik labels) are
# added by Dokploy from its Domains tab, so none are declared here.
services:
  api:
    build: ./api
    restart: unless-stopped
    environment:
      # The owner's account email (spec 030a): required before the accounts version starts on a
      # deck with data, and with LA_CARTE_API_TOKEN.
      LA_CARTE_OWNER_EMAIL: ${LA_CARTE_OWNER_EMAIL:-}
      # Optional: imported once as the owner's personal access token `legacy`, then ignored.
      LA_CARTE_API_TOKEN: ${LA_CARTE_API_TOKEN:-}
      # The public https URL: OAuth issuer, MCP resource (<url>/mcp), serverInfo icon (/icon.png).
      LA_CARTE_PUBLIC_URL: ${LA_CARTE_PUBLIC_URL:-}
      # Spec 032a: the SQLCipher key of the whole database file (64 hex, openssl rand -hex 32).
      # Required with a public URL. Losing it loses every account: keep a copy offline.
      LA_CARTE_DB_KEY: ${LA_CARTE_DB_KEY:-}
      # Only to rotate the key: set the new one here, deploy, then move it to LA_CARTE_DB_KEY.
      LA_CARTE_DB_KEY_NEW: ${LA_CARTE_DB_KEY_NEW:-}
    expose:
      - "8000"
    volumes:
      - la-carte-data:/data

volumes:
  la-carte-data:
